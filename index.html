<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruhani Markaz Updates</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b6e4f">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f0f2f5;color:#222;padding-bottom:80px}
header{background:#0b6e4f;color:#fff;padding:18px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px}header p{margin:4px 0 0;opacity:.9;font-size:13px}
.card{background:#fff;margin:12px;padding:15px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,select{width:100%;padding:12px;margin-top:8px;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{cursor:pointer}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:bold;font-size:15px;margin-top:8px}
.btn-green{background:#0b6e4f;color:#fff}.btn-red{background:#ff0000;color:#fff}.btn-grey{background:#eee;color:#333}
.list-item{display:flex;justify-content:space-between;align-items:center;background:#f8f9fa;padding:10px;border-radius:10px;margin-top:8px}
</style>
</head>
<body>

<header>
<h1>🕌 Ruhani Markaz Kotri</h1>
<p>Members • Attendance • 1000+ Bayanat</p>
</header>

<!-- MEMBERS -->
<div class="card">
<h3 style="margin:0">👥 Members Add Karein</h3>
<input id="mName" placeholder="Member ka naam">
<input id="mPhone" placeholder="Phone Number">
<button class="btn btn-green" onclick="addMember()">+ Member Add Karein</button>
<input id="mSearch" placeholder="Member search..." oninput="renderMembers()">
<div id="memberList"></div>
</div>

<!-- ATTENDANCE -->
<div class="card">
<h3 style="margin:0">📋 Attendance</h3>
<p style="font-size:13px;color:#666">Aaj ki date: <b id="todayDate"></b></p>
<div id="attList"></div>
<button class="btn btn-green" onclick="saveAttendance()">✅ Attendance Save Karein</button>
<p id="attMsg" style="text-align:center;color:#0b6e4f;font-weight:bold"></p>
</div>

<!-- 1000 VIDEOS -->
<div class="card">
<h3 style="margin:0">🎥 Bayanat - 1000+ Videos</h3>
<input id="vSearch" placeholder="Video search karein... Jumma, Bayan..." oninput="renderVideos()">
<div id="videoList"></div>
<div style="margin-top:15px;border-top:1px solid #eee;padding-top:10px">
<h4 style="margin:0">Admin - Nayi Video Add Karein</h4>
<input id="vTitle" placeholder="Video ka naam - Misal: Jumma Bayan">
<input id="vLink" placeholder="YouTube / TikTok Link paste karein">
<button class="btn btn-red" onclick="addVideo()">+ Video Add Karein</button>
</div>
</div>

<div class="card" id="playerCard" style="display:none">
<h3 id="playingTitle" style="margin:0">Playing...</h3>
<div id="playerBox" style="margin-top:10px"></div>
<button class="btn btn-grey" onclick="closePlayer()">Band Karein</button>
</div>

<script>
// Tumhara Asli Firebase Config - Ruhan i Markaz Kotri
const firebaseConfig = {
  apiKey: "AIzaSyCm6fpmntJmEiP0POM4Xi829CIu8Gni8Pw",
  authDomain: "ruhanimarkazkotri.firebaseapp.com",
  databaseURL: "https://ruhanimarkazkotri-default-rtdb.firebaseio.com",
  projectId: "ruhanimarkazkotri",
  storageBucket: "ruhanimarkazkotri.firebasestorage.app",
  messagingSenderId: "906148918722",
  appId: "1:906148918722:web:d6c78aff570d9a3f67925b",
  measurementId: "G-L73LV908LG"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
document.getElementById("todayDate").innerText = new Date().toLocaleDateString("en-PK");

// --- MEMBERS ---
const memRef = db.ref("members");
let allMembers = {};
memRef.on("value", s=>{ allMembers = s.val()||{}; renderMembers(); renderAtt(); });
function addMember(){
  let n = document.getElementById("mName").value.trim();
  let p = document.getElementById("mPhone").value.trim();
  if(!n){ alert("Naam likhein"); return; }
  memRef.push({name:n, phone:p});
  document.getElementById("mName").value=""; document.getElementById("mPhone").value="";
  alert("Member Add Ho Gaya ✅");
}
function renderMembers(){
  let q = document.getElementById("mSearch").value.toLowerCase();
  let h = "";
  for(let id in allMembers){
    let m = allMembers[id];
    if(m.name.toLowerCase().includes(q)){
      h += '<div class="list-item"><div><b>'+m.name+'</b><br><small>'+(m.phone||"")+'</small></div><button onclick="delMember(\''+id+'\')" style="background:#ff5252;color:#fff;border:none;padding:8px 10px;border-radius:8px">X</button></div>';
    }
  }
  document.getElementById("memberList").innerHTML = h || "<p style='text-align:center;color:#888'>Koi member nahi</p>";
}
function delMember(id){ if(confirm("Delete karein?")) memRef.child(id).remove(); }

// --- ATTENDANCE ---
function renderAtt(){
  let h = "";
  for(let id in allMembers){
    let m = allMembers[id];
    h += '<div class="list-item"><div><b>'+m.name+'</b></div><select id="att_'+id+'"><option value="Present">✅ Present</option><option value="Absent">❌ Absent</option><option value="Leave">🏠 Leave</option></select></div>';
  }
  document.getElementById("attList").innerHTML = h || "Pehle member add karein";
}
function saveAttendance(){
  let date = new Date().toISOString().slice(0,10);
  let data = {};
  for(let id in allMembers){ data[id] = document.getElementById("att_"+id).value; }
  db.ref("attendance/"+date).set(data).then(()=>{ document.getElementById("attMsg").innerText = "✅ Attendance Save Ho Gayi!"; });
}

// --- 1000 VIDEOS ---
const vidRef = db.ref("videos");
let allVideos = {};
vidRef.on("value", s=>{ allVideos = s.val()||{}; renderVideos(); });
function addVideo(){
  let t = document.getElementById("vTitle").value.trim();
  let l = document.getElementById("vLink").value.trim();
  if(!t || !l){ alert("Naam aur Link dono likhein"); return; }
  let embed = l;
  if(l.includes("youtube.com/watch?v=")){ embed = l.replace("watch?v=","embed/").split("&")[0]; }
  if(l.includes("youtu.be/")){ embed = "https://www.youtube.com/embed/" + l.split("youtu.be/")[1].split("?")[0]; }
  if(l.includes("youtube.com/shorts/")){ embed = l.replace("shorts/","embed/").split("?")[0]; }
  vidRef.push({title:t, link:l, embed:embed, date:new Date().toLocaleDateString("en-PK")});
  document.getElementById("vTitle").value=""; document.getElementById("vLink").value="";
  alert("Video Add Ho Gayi ✅");
}
function renderVideos(){
  let q = document.getElementById("vSearch").value.toLowerCase();
  let html = "";
  let ids = Object.keys(allVideos).reverse();
  for(let id of ids){
    let v = allVideos[id];
    if(v.title.toLowerCase().includes(q)){
      html += '<div class="list-item"><div><b>'+v.title+'</b><br><small>'+(v.date||"")+'</small></div><div><button onclick="playVideo(\''+id+'\')" style="background:#ff0000;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:bold">▶ Play</button> <button onclick="delVideo(\''+id+'\')" style="background:#ff5252;color:#fff;border:none;padding:8px 10px;border-radius:8px">X</button></div></div>';
    }
  }
  document.getElementById("videoList").innerHTML = html || "<p style='text-align:center;color:#888'>Abhi koi video nahi, upar se add karein</p>";
}
function playVideo(id){
  let v = allVideos[id];
  document.getElementById("playerCard").style.display = "block";
  document.getElementById("playingTitle").innerText = "▶ " + v.title;
  if(v.embed.includes("youtube")){
    document.getElementById("playerBox").innerHTML = '<iframe width="100%" height="220" src="'+v.embed+'" frameborder="0" allowfullscreen style="border-radius:12px"></iframe>';
  } else {
    document.getElementById("playerBox").innerHTML = '<video controls autoplay style="width:100%;border-radius:12px" src="'+v.link+'"></video><br><a href="'+v.link+'" target="_blank">TikTok Par Kholo</a>';
  }
  document.getElementById("playerCard").scrollIntoView({behavior:"smooth"});
}
function closePlayer(){ document.getElementById("playerCard").style.display = "none"; document.getElementById("playerBox").innerHTML = ""; }
function delVideo(id){ if(confirm("Video delete karein?")) vidRef.child(id).remove(); }

// --- SERVICE WORKER ---
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
