<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruhani Markaz Updates</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f3d2e">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f6f1e7;color:#222;min-height:100vh}
header{background:linear-gradient(135deg,#0f3d2e,#1a5c44);color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.2)}
header h1{font-size:24px;color:#f5c542}
header p{font-size:13px;opacity:.9;margin-top:4px}
.lang-bar{display:flex;justify-content:center;gap:8px;margin:12px 0 0}
.lang-bar button{border:2px solid #f5c542;background:transparent;color:#fff;padding:6px 16px;border-radius:20px;cursor:pointer;font-weight:700}
.lang-bar button.active{background:#f5c542;color:#0f3d2e}
.container{max-width:650px;margin:auto;padding:14px;padding-bottom:80px}
.top-btns{display:flex;gap:10px;margin:10px 0}
.btn{flex:1;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.btn-gold{background:#f5c542;color:#0f3d2e}
.btn-dark{background:#0f3d2e;color:#fff}
.btn-red{background:#c0392b;color:#fff}
.live-box{background:#000;border-radius:14px;overflow:hidden;margin:14px 0;display:none}
.live-box.show{display:block}
.live-head{background:#e74c3c;color:#fff;padding:8px 12px;font-weight:800;display:flex;gap:8px;align-items:center}
.live-box iframe{width:100%;height:280px;border:0;display:block}
.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08);border-right:5px solid #f5c542}
.card h3{color:#0f3d2e;margin-bottom:6px;font-size:18px}
.card small{color:#888}
.card p{margin-top:8px;line-height:1.7;white-space:pre-wrap}
.card img,.card video{width:100%;border-radius:10px;margin-top:10px}
.admin-box{background:#fff;border:2px solid #0f3d2e;border-radius:14px;padding:14px;margin:14px 0;display:none}
.admin-box.show{display:block}
input,textarea,select{width:100%;padding:11px;border:1.5px solid #ddd;border-radius:10px;margin:7px 0;font-size:15px;font-family:inherit}
textarea{min-height:90px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal.show{display:flex}
.modal-inner{background:#fff;width:100%;max-width:360px;border-radius:16px;padding:20px;text-align:center}
.empty{text-align:center;color:#888;padding:30px}
.hidden{display:none!important}
[dir="ltr"] .card{border-right:none;border-left:5px solid #f5c542}
</style>
</head>
<body>
<header>
<h1 data-t="title">روحانی مرکز اپڈیٹس</h1>
<p data-t="subtitle">بayanat • Mehfil • Ijtema • Live</p>
<div class="lang-bar">
<button onclick="setLang('en')" id="btn-en">English</button>
<button onclick="setLang('ur')" id="btn-ur" class="active">اردو</button>
<button onclick="setLang('ar')" id="btn-ar">العربية</button>
</div>
</header>

<div class="container">
<div class="top-btns">
<button class="btn btn-dark" onclick="openLogin()" data-t="adminBtn">🔐 ایڈمن</button>
<button class="btn btn-gold" onclick="shareApp()" data-t="shareBtn">📤 شیئر کریں</button>
</div>

<div id="liveBox" class="live-box">
<div class="live-head">🔴 <span data-t="liveNow">LIVE NOW</span></div>
<iframe id="liveFrame" allowfullscreen></iframe>
</div>

<div id="adminBox" class="admin-box">
<h3 data-t="adminPanel">ایڈمن پینل</h3>
<input id="postTitle" data-ph="postTitlePh" placeholder="عنوان / Title">
<textarea id="postText" data-ph="postTextPh" placeholder="تفصیل لکھیں..."></textarea>
<input type="file" id="postFile" accept="image/*,video/*">
<select id="postType">
<option value="bayan" data-t="optBayan">بیان</option>
<option value="mehfil" data-t="optMehfil">محفل</option>
<option value="ijtema" data-t="optIjtema">اجتماع</option>
<option value="live" data-t="optLive">لائیو لنک</option>
</select>
<input id="liveLink" data-ph="liveLinkPh" placeholder="YouTube / Facebook Live Link yahan paste karein (sirf Live ke liye)">
<button class="btn btn-gold" onclick="addPost()" data-t="publish">پوسٹ کریں</button>
<button class="btn btn-red" onclick="logout()" data-t="logout">لاگ آؤٹ</button>
<p style="font-size:12px;color:#888;margin-top:8px" data-t="adminNote">Live ke liye Type me Live select karein aur link paste karein.</p>
</div>

<div id="posts"></div>
<div id="empty" class="empty" data-t="noPost">ابھی کوئی اپڈیٹ نہیں ہے۔</div>
</div>

<div id="loginModal" class="modal">
<div class="modal-inner">
<h3 data-t="loginTitle">ایڈمن لاگ ان</h3>
<input type="password" id="passInput" data-ph="passPh" placeholder="ایڈمن کوڈ">
<button class="btn btn-dark" onclick="checkLogin()" data-t="login">لاگ ان</button>
<button class="btn" onclick="closeLogin()" data-t="cancel">بند کریں</button>
<p id="loginErr" style="color:red;font-size:13px;margin-top:8px"></p>
</div>
</div>

<script>
const T = {
en:{title:"Ruhani Markaz Updates",subtitle:"Bayanat • Mehfil • Ijtema • Live",adminBtn:"🔐 Admin",shareBtn:"📤 Share",liveNow:"LIVE NOW",adminPanel:"Admin Panel",postTitlePh:"Title",postTextPh:"Write details...",optBayan:"Bayan",optMehfil:"Mehfil",optIjtema:"Ijtema",optLive:"Live Link",liveLinkPh:"Paste YouTube / Facebook Live Link (for Live only)",publish:"Publish Post",logout:"Logout",adminNote:"For Live, select Live in Type and paste link.",noPost:"No updates yet.",loginTitle:"Admin Login",passPh:"Admin Code",login:"Login",cancel:"Close",wrong:"Wrong code!",delete:"Delete",shareText:"Ruhani Markaz Updates App - Download:\n"},
ur:{title:"روحانی مرکز اپڈیٹس",subtitle:"بیانات • محفل • اجتماع • لائیو",adminBtn:"🔐 ایڈمن",shareBtn:"📤 شیئر کریں",liveNow:"لائیو جاری ہے",adminPanel:"ایڈمن پینل",postTitlePh:"عنوان",postTextPh:"تفصیل لکھیں...",optBayan:"بیان",optMehfil:"محفل",optIjtema:"اجتماع",optLive:"لائیو لنک",liveLinkPh:"یوٹیوب / فیس بک لائیو لنک یہاں پیسٹ کریں (صرف لائیو کے لیے)",publish:"پوسٹ کریں",logout:"لاگ آؤٹ",adminNote:"لائیو کے لیے Type میں Live منتخب کریں اور لنک پیسٹ کریں۔",noPost:"ابھی کوئی اپڈیٹ نہیں ہے۔",loginTitle:"ایڈمن لاگ ان",passPh:"ایڈمن کوڈ",login:"لاگ ان",cancel:"بند کریں",wrong:"غلط کوڈ!",delete:"ڈیلیٹ",shareText:"روحانی مرکز اپڈیٹس ایپ - ڈاؤن لوڈ کریں:\n"},
ar:{title:"تحديثات المركز الروحاني",subtitle:"بيانات • محفل • اجتماع • مباشر",adminBtn:"🔐 المشرف",shareBtn:"📤 مشاركة",liveNow:"مباشر الآن",adminPanel:"لوحة المشرف",postTitlePh:"العنوان",postTextPh:"اكتب التفاصيل...",optBayan:"بيان",optMehfil:"محفل",optIjtema:"اجتماع",optLive:"رابط مباشر",liveLinkPh:"الصق رابط البث المباشر يوتيوب / فيسبوك (للمباشر فقط)",publish:"نشر المنشور",logout:"تسجيل خروج",adminNote:"للمباشر، اختر مباشر في النوع والصق الرابط.",noPost:"لا توجد تحديثات بعد.",loginTitle:"دخول المشرف",passPh:"رمز المشرف",login:"دخول",cancel:"إغلاق",wrong:"رمز خاطئ!",delete:"حذف",shareText:"تطبيق تحديثات المركز الروحاني - تحميل:\n"}
};
let lang = localStorage.getItem('rm_lang') || 'ur';
function setLang(l){
lang=l; localStorage.setItem('rm_lang',l);
document.documentElement.lang=l;
document.documentElement.dir=(l==='en')?'ltr':'rtl';
document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent=T[l][el.dataset.t] });
document.querySelectorAll('[data-ph]').forEach(el=>{ el.placeholder=T[l][el.dataset.ph] });
document.getElementById('btn-en').classList.toggle('active',l==='en');
document.getElementById('btn-ur').classList.toggle('active',l==='ur');
document.getElementById('btn-ar').classList.toggle('active',l==='ar');
render();
}
// Admin code is NOT stored here - only its secure hash is checked. No one can see the real code from source.
const ADMIN_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";
async function sha256(str){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
let isAdmin = sessionStorage.getItem('rm_admin')==='1';
function openLogin(){ if(isAdmin){document.getElementById('adminBox').classList.add('show'); return;} document.getElementById('loginModal').classList.add('show'); }
function closeLogin(){ document.getElementById('loginModal').classList.remove('show'); }
async function checkLogin(){
const v=document.getElementById('passInput').value;
const h=await sha256(v);
if(h===ADMIN_HASH){ isAdmin=true; sessionStorage.setItem('rm_admin','1'); document.getElementById('adminBox').classList.add('show'); closeLogin(); document.getElementById('passInput').value=''; }
else{ document.getElementById('loginErr').textContent=T[lang].wrong; }
}
function logout(){ isAdmin=false; sessionStorage.removeItem('rm_admin'); document.getElementById('adminBox').classList.remove('show'); render(); }

function getPosts(){ try{return JSON.parse(localStorage.getItem('rm_posts')||'[]')}catch(e){return []} }
function savePosts(p){ localStorage.setItem('rm_posts', JSON.stringify(p)); }

function toEmbed(url){
if(!url) return '';
if(url.includes('youtube.com/watch')) return url.replace('watch?v=','embed/');
if(url.includes('youtu.be/')) return url.replace('youtu.be/','www.youtube.com/embed/');
if(url.includes('facebook.com')) return 'https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(url)+'&show_text=false&autoplay=true';
return url;
}
function addPost(){
const title=document.getElementById('postTitle').value.trim();
const text=document.getElementById('postText').value.trim();
const type=document.getElementById('postType').value;
const liveLink=document.getElementById('liveLink').value.trim();
const file=document.getElementById('postFile').files[0];
if(!title && !text && !liveLink) return;
if(file){
const r=new FileReader();
r.onload=e=>{ doAdd(title,text,type,liveLink,e.target.result, file.type.startsWith('video')?'video':'image'); };
r.readAsDataURL(file);
}else{ doAdd(title,text,type,liveLink,'',''); }
}
function doAdd(title,text,type,liveLink,media,mediaType){
const posts=getPosts();
posts.unshift({id:Date.now(),title,text,type,liveLink,media,mediaType,date:new Date().toLocaleString()});
savePosts(posts);
document.getElementById('postTitle').value=''; document.getElementById('postText').value=''; document.getElementById('liveLink').value=''; document.getElementById('postFile').value='';
render();
}
function deletePost(id){ if(!confirm(T[lang].delete+'?')) return; savePosts(getPosts().filter(p=>p.id!==id)); render(); }
function render(){
const posts=getPosts();
const box=document.getElementById('posts');
document.getElementById('empty').style.display=posts.length?'none':'block';
const live=posts.find(p=>p.type==='live' && p.liveLink);
const liveBox=document.getElementById('liveBox');
if(live){ liveBox.classList.add('show'); document.getElementById('liveFrame').src=toEmbed(live.liveLink); }
else{ liveBox.classList.remove('show'); }
box.innerHTML=posts.map(p=>`
<div class="card"><h3>${p.title||''}</h3><small>${p.date} • ${p.type}</small><p>${p.text||''}</p>
${p.media ? (p.mediaType==='video'? `<video src="${p.media}" controls></video>` : `<img src="${p.media}">`) : ''}
${p.type==='live' && p.liveLink ? `<a href="${p.liveLink}" target="_blank" style="color:#0f3d2e;font-weight:700">▶ ${T[lang].liveNow}</a>`:''}
${isAdmin? `<br><button class="btn btn-red" style="margin-top:10px;padding:8px" onclick="deletePost(${p.id})">${T[lang].delete}</button>`:''}
</div>`).join('');
if(isAdmin) document.getElementById('adminBox').classList.add('show');
}
function shareApp(){
const txt=T[lang].shareText + location.href;
if(navigator.share){ navigator.share({text:txt}); } else { navigator.clipboard.writeText(txt); alert(txt); }
}
setLang(lang);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
